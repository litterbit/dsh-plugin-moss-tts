name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 步骤都写在 tools/ci.mjs 里：本地与 CI 完全一致，失败还会留一行
      # ::error:: 注解（GitHub 的步骤失败本身不带任何原因）。
      - name: tests
        run: node tools/ci.mjs
