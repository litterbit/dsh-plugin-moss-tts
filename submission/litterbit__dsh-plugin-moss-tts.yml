description:
  en: 'Reads Harness replies aloud with the MOSS-TTS-Nano-100M CPU engine: fully offline, one-click engine download with sha256 verification, auto-read with per-reply read buttons, and streamed playback that starts in about a tenth of a second. Weights are installed once and shared with the companion CLI and web playground.'
  zh: '用 MOSS-TTS-Nano-100M 的 CPU 引擎朗读 Harness 回复：完全离线，一键下载引擎并校验 sha256，回复定稿自动朗读、每条回复可单独朗读，流式播放约 0.1 秒起声。权重只装一份，与同项目的命令行和网页试听台共用。'
